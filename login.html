<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiPortfolio | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-panel auth-visual">
        <div class="auth-overlay">
          <div class="eyebrow alt">Build your story</div>
          <h2>Bring your design work to the world.</h2>
          <p>
            Showcase projects, build credibility, and turn your portfolio into real opportunities.
          </p>
        </div>
      </div>

      <div class="auth-panel auth-card">
        <div class="auth-head">
          <a href="index.html" class="brand">
            <span class="brand-mark">A</span>
            <span>ArchiPortfolio</span>
          </a>
          <h3>Welcome back</h3>
        </div>

        <form class="auth-form">
          <label>
            Email address
            <input type="email" placeholder="name@studio.com" />
          </label>

          <label>
            Password
            <input type="password" placeholder="••••••••" />
          </label>

          <div class="auth-row">
            <label class="checkbox-row">
              <input type="checkbox" checked />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn primary full-width">Sign in</button>

          <div class="divider"><span>or</span></div>

          <button type="button" class="btn secondary full-width">Continue with Google</button>

          <p class="switch">
            Don’t have an account? <a href="#">Create one</a>
          </p>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
